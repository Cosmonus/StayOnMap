<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- NO ANALYTICS SCRIPT HERE, AND THAT IS THE DECISION — do not re-add one.
         A GA4 gtag tag lived here for part of 2026-08-07 and was removed the
         same day (operator decision). It worked, but it cost more than it
         returned: it set `_ga` cookies for up to two years, which is the only
         reason this product needed a cookie section in /privacy at all and the
         only thing that put a consent banner on the table. Our own first-party
         funnel (backend/src/features/analytics) already answers the question
         the business actually asks — of the people who arrived, how many
         reached a visit request — from our own Postgres, keyed to a session id
         in sessionStorage that is not a cookie and cannot follow anyone
         between visits.
         GA4 still receives the MOBILE APP's funnel, forwarded server-side over
         the Measurement Protocol (backend/src/features/analytics/ga4.js). That
         path sets no cookie on anybody and needs no script here.
         Adding any third-party tag back to this file re-opens a legal
         question, not just an engineering one — see /privacy §8. -->

    <!-- Search Console ownership proof. Inert by construction, and that is why
         it is allowed to sit below the warning above: it declares a string, it
         does not load a script, set a cookie, or contact anybody. Google reads
         it only when fetching this page itself, on its own schedule. It is not
         a tag, and nothing in /privacy changes because of it.
         Deleting it un-verifies the property in Search Console. -->
    <meta name="google-site-verification" content="pTwzt8yLEX0BA1_o06l9qHATEyvpaxKzIg2_cdRt3b8" />

    <!-- Base SEO — overridden per-page by react-helmet-async -->
    <title>StayOnMap — Rent with intelligence.</title>
    <meta name="description" content="Every rental on StayOnMap is scored live by a TrustScore engine and fraud-detection agent. Search verified homes on a live map across India." />
    <meta name="theme-color" content="#0d8a5f" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph defaults -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="StayOnMap" />
    <meta property="og:title"       content="StayOnMap — Rent with intelligence." />
    <meta property="og:description" content="Every rental on StayOnMap is scored live by a TrustScore engine and fraud-detection agent. Search verified homes on a live map across India." />
    <meta property="og:image"       content="https://www.stayonmap.com/og-default.jpg" />
    <meta property="og:url"         content="https://www.stayonmap.com" />
    <meta property="og:locale"      content="en_IN" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@StayOnMap" />
    <meta name="twitter:title"       content="StayOnMap — Rent with intelligence." />
    <meta name="twitter:description" content="Every rental on StayOnMap is scored live by a TrustScore engine and fraud-detection agent. Search verified homes on a live map across India." />
    <meta name="twitter:image"       content="https://www.stayonmap.com/og-default.jpg" />

    <!-- WebSite structured data (enables Google Sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "StayOnMap",
      "url": "https://www.stayonmap.com",
      "description": "Broker-free rental discovery platform for India",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.stayonmap.com/properties?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "StayOnMap",
      "url": "https://www.stayonmap.com",
      "logo": "https://www.stayonmap.com/icon-192.png",
      "sameAs": []
    }
    </script>

    <!-- Performance hints -->
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://maps.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://rnfjdpbsxdwcpawvriqg.supabase.co" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
