<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics (GA4). Kept high in <head> so page_view timing is real.
         This is IN ADDITION to our first-party funnel telemetry
         (backend/src/features/analytics) — that one answers "did the people who
         arrived book a visit", this one answers "where did they arrive from".
         GA4 is a third-party processor and sets cookies: /privacy must say so. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H2GWTWJ6J4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-H2GWTWJ6J4');
    </script>

    <!-- Base SEO — overridden per-page by react-helmet-async -->
    <title>StayOnMap — Rent with intelligence.</title>
    <meta name="description" content="Every rental on StayOnMap is scored live by a TrustScore engine and fraud-detection agent. Search verified homes on a live map across India." />
    <meta name="theme-color" content="#0d8a5f" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph defaults -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="StayOnMap" />
    <meta property="og:title"       content="StayOnMap — Rent with intelligence." />
    <meta property="og:description" content="Every rental on StayOnMap is scored live by a TrustScore engine and fraud-detection agent. Search verified homes on a live map across India." />
    <meta property="og:image"       content="https://www.stayonmap.com/og-default.jpg" />
    <meta property="og:url"         content="https://www.stayonmap.com" />
    <meta property="og:locale"      content="en_IN" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@StayOnMap" />
    <meta name="twitter:title"       content="StayOnMap — Rent with intelligence." />
    <meta name="twitter:description" content="Every rental on StayOnMap is scored live by a TrustScore engine and fraud-detection agent. Search verified homes on a live map across India." />
    <meta name="twitter:image"       content="https://www.stayonmap.com/og-default.jpg" />

    <!-- WebSite structured data (enables Google Sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "StayOnMap",
      "url": "https://www.stayonmap.com",
      "description": "Broker-free rental discovery platform for India",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.stayonmap.com/properties?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "StayOnMap",
      "url": "https://www.stayonmap.com",
      "logo": "https://www.stayonmap.com/icon-192.png",
      "sameAs": []
    }
    </script>

    <!-- Performance hints -->
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://maps.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://rnfjdpbsxdwcpawvriqg.supabase.co" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
