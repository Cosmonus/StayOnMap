title = "StayOnMap gitleaks config"

# Start from gitleaks' built-in rule set (AWS keys, private keys, generic
# high-entropy secrets, provider-specific tokens, etc.) and only add
# StayOnMap-specific allowlisting on top — never redefine the base rules here.
[extend]
useDefault = true

[allowlist]
description = "Known-safe placeholder files/values — not real secrets"

paths = [
  '''(^|/)\.env\.example$''',
  '''package-lock\.json$''',
]

regexTarget = "match"
regexes = [
  '''ci-placeholder''',
  '''your_[a-zA-Z0-9_]+_here''',
  '''your_[a-zA-Z0-9_]+_key''',
  '''change_this_to_a_long_random_string''',
]
