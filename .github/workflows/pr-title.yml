name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    name: Enforce "stayonmap - <title>" format
    runs-on: ubuntu-latest
    # Dependabot's auto-generated PR titles (e.g. "chore(backend): bump
    # express from 4.18.2 to 4.19.0") never match ^stayonmap - .+ — exempt
    # its PRs rather than let dependabot.yml's automation get blocked on a
    # title format it has no way to produce.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^stayonmap\ -\ .+ ]]; then
            echo "::error::PR title must start with 'stayonmap - ', got: \"$PR_TITLE\""
            echo "Example: stayonmap - Fix appointment scheduling bug"
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"
