name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    name: Enforce "stayonmap - <title>" format
    runs-on: ubuntu-latest
    # The dependabot exemption is decided INSIDE the step, never with a
    # job-level `if:`. This job is a REQUIRED status check on master, and a job
    # that does not run does not report — so `if: github.actor != 'dependabot
    # [bot]'` up here did the exact opposite of what it was added for: instead
    # of exempting dependabot it blocked every one of its PRs permanently, and
    # nine had accumulated by 2026-08-11 that could never have been merged.
    #
    # A skipped required check is indistinguishable from a missing one. Keep the
    # job unconditional so it always reports, and let the script decide.
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          # The PR's AUTHOR, not `github.actor`. github.actor is whoever
          # triggered the event, so the moment a human touches a dependabot PR —
          # "Update branch", a rerun, a pushed fixup — the actor becomes that
          # human and the exemption stops applying to a title dependabot wrote
          # and cannot change. That failed on the very first dependabot PR this
          # workflow was fixed for. The author does not change.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot's titles ("chore(deps): bump express from 4.18.2 to
          # 4.19.0") cannot match the format, and it has no way to produce one.
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR — title format not enforced: $PR_TITLE"
            exit 0
          fi
          if [[ ! "$PR_TITLE" =~ ^stayonmap\ -\ .+ ]]; then
            echo "::error::PR title must start with 'stayonmap - ', got: \"$PR_TITLE\""
            echo "Example: stayonmap - Fix appointment scheduling bug"
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"
