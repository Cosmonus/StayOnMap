name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual trigger. Without this there is NO way to start a run by hand: pushes
  # only fire on master, and everything else rides the pull_request event — so
  # when GitHub drops or never queues a `synchronize` (which it did on
  # 2026-08-07, leaving three commits with no run at all and the PR stuck on
  # mergeable: UNKNOWN), the only recourse was closing and reopening the PR.
  #
  # `gh workflow run ci.yml --ref <branch>` once this is on the default branch.
  #
  # On master this DEPLOYS — see the deploy job's `if:`. It did not until
  # 2026-08-07, which made the escape hatch useless in the one case it exists
  # for: GitHub also dropped the `push` event on the PR #176 merge, so master
  # was seven hours ahead of production with no way to close the gap by hand.
  workflow_dispatch:

jobs:
  guard:
    name: Guard (no env files / secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block committed env / credential files
        run: |
          set -e
          # .env.example files are the only intentional exception — every
          # variant of a real .env, plus TLS keys/certs and mobile signing
          # material, must never be tracked in git.
          BLOCKED=$(git ls-files \
            | grep -Ei '(^|/)\.env(\.[^.]+)?$|\.pem$|\.key$|\.p12$|\.jks$|\.mobileprovision$|google-services\.json$|GoogleService-Info\.plist$|serviceAccountKey.*\.json$' \
            | grep -v '\.env\.example$' \
            || true)
          if [ -n "$BLOCKED" ]; then
            echo "::error::Blocked file(s) are tracked in git. Remove them, force-push is NOT the fix — rotate any exposed credentials immediately:"
            echo "$BLOCKED"
            exit 1
          fi
          echo "No blocked env/credential files tracked."

      - name: Scan for hardcoded secrets
        # gitleaks/gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE
        # secret for orgs (see github.com/gitleaks/gitleaks-action#-announcement)
        # — that gate is in the Action wrapper, not the underlying gitleaks
        # CLI, which stays free/open-source. Run the CLI directly instead.
        run: |
          set -e
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..$AFTER"
          else
            RANGE=""
          fi
          if [ -n "$RANGE" ]; then
            ./gitleaks detect --source . --config .gitleaks.toml --log-opts="$RANGE" --redact -v
          else
            # First push to an empty branch (or a force-push with no valid
            # 'before') — no meaningful range, fall back to the latest commit only.
            ./gitleaks detect --source . --config .gitleaks.toml --log-opts="-1" --redact -v
          fi

      - name: Scan the whole checkout for secrets
        # The scan above only covers a COMMIT RANGE, so a secret that landed
        # outside any range it ever examined — a force-push, or anything
        # committed before this job existed — stays invisible forever. This one
        # asks a different question: is there a secret in the tree RIGHT NOW,
        # regardless of when it arrived.
        #
        # `--no-git` means "scan files on disk, not history". That is only safe
        # HERE: a CI checkout contains tracked files and nothing else, so it
        # sees exactly what the repo ships. Do not copy this to a developer
        # machine — run against a real working tree it also reads .env,
        # mobile/credentials.json, the Play service-account key and
        # node_modules, and reports hundreds of findings that are all correctly
        # gitignored. (Measured 2026-08-06: 464 locally, 0 on the tracked tree.)
        #
        # Verified before being added, by exporting the tracked tree with
        # `git archive HEAD` and scanning that — it passes clean today, so this
        # cannot turn master red on arrival.
        run: |
          set -e
          ./gitleaks detect --source . --config .gitleaks.toml --no-git --redact -v

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    needs: guard
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Generate the Prisma client so `import ... from '@prisma/client'` works.
      # Nothing needed it for two years because tests mock lib/prisma.js
      # wholesale — then the first src file to import the real package for its
      # error class broke four unrelated suites on CI while passing on every
      # machine that had ever run a migration (2026-08-11, PR #228). The import
      # was rewritten away, but backend.md documents the P2025-instanceof idiom
      # as the pattern for update paths, so the NEXT person to follow the doc
      # hits the same wall unless the client exists here.
      # DATABASE_URL is a placeholder: generate never connects, but the config
      # loader refuses to start without the variable resolving at all.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci-placeholder@localhost:5432/ci
      - run: npm run lint
      - run: npm test
      # --omit=dev: only fail CI on vulnerabilities that ship to production —
      # dev-only tooling (vitest/vite/esbuild chain) is tracked separately in
      # todo.md and needs a breaking major-version bump to fully resolve.
      # --audit-level=high: moderate advisories are common enough across the
      # ecosystem that gating on them would cause constant unrelated CI noise.
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    needs: guard
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000/api/v1
          VITE_GOOGLE_MAPS_API_KEY: ci-placeholder
          VITE_VAPID_PUBLIC_KEY: ci-placeholder
          VITE_APP_ENV: ci
      - run: npm audit --omit=dev --audit-level=high

  # Mobile lint was MISSING from this job until 2026-08-11, while backend and
  # frontend had both run it since the workflow was written. Nothing enforced
  # it, so a react-hooks/purity error sat in master until somebody ran `expo
  # lint` by hand — and the pre-push hook did not cover mobile either, so there
  # was no gate anywhere. The lesson is not "add lint"; it is that a job's NAME
  # is what everyone reads to decide what is covered, and this one said what it
  # did rather than what it did not.
  mobile:
    name: Mobile (lint + test + bundle smoke check)
    runs-on: ubuntu-latest
    needs: guard
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # `expo lint` reads .env via expo's env loading, and a missing one is a
      # log line rather than a failure — the same two placeholders the export
      # step passes are set here so the two steps cannot disagree about config.
      - run: npm run lint
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder
      - run: npm test
      - run: npx expo export --platform android
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder

  # Auto-deploy to the self-hosted Google Cloud VM after a merge to master, but
  # ONLY once every build job is green. SSHes in as the deploy user and runs the
  # same deploy.sh an operator would run by hand (pull → migrate → build →
  # restart → nginx reload → /health). This IS the deployment path — there is no
  # platform push-to-deploy behind it.
  #
  # Setup (one-time, done in GitHub + on the box) is in
  # infra/server/README-server.md → "Continuous deployment (GitHub Actions)":
  # the four secrets below, plus a forced-command deploy key on the box.
  deploy:
    name: Deploy to production VM
    runs-on: ubuntu-latest
    needs: [guard, backend, frontend, mobile]
    # Master only — never on a pull_request run (which also has the master
    # base) and never from a fork.
    #
    # `workflow_dispatch` is here as of 2026-08-07 and is the whole point of the
    # manual trigger. It was NOT, and that made the escape hatch useless in the
    # exact situation it exists for: GitHub dropped the `push` event on the
    # merge of PR #176, so no run was queued, so nothing deployed. Dispatching
    # by hand then ran every check and skipped the one job that mattered —
    # "Deploy to production VM: This job was skipped" — because the event was
    # `workflow_dispatch`, not `push`.
    #
    # Widening this is safe for the reason the two other conditions already
    # cover: the ref must be master, and dispatch requires write access, which
    # is the same bar as pushing to a protected master in the first place.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Serialize deploys so two quick merges can't build/restart on top of each
    # other; queue, don't cancel — a half-finished release must complete.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Run deploy.sh on the VM over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # Fail with a pointer, not a cryptic ssh error, if setup was skipped.
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set. See infra/server/README-server.md → 'Continuous deployment (GitHub Actions)'."
              exit 1
            fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY"     > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # IdentitiesOnly: never fall back to an agent/other key.
          # StrictHostKeyChecking=yes + pinned known_hosts: a spoofed host can't
          # harvest the deploy key. The box's authorized_keys SHOULD force the
          # command (see README); the explicit path here is the fallback.
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              '/srv/stayonmap/infra/server/deploy.sh'
