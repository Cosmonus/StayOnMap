# ============================================================================
# StayOnMap — nginx site. Serves the React build as static files and reverse-
# proxies the API + Socket.io SAME-ORIGIN, so the browser never makes a
# cross-origin request (no CORS in play) and the bundle bakes no API hostname.
#
# Install: /etc/nginx/sites-available/stayonmap.conf  (setup-server.sh symlinks
# it into sites-enabled and removes the default site).
#
# TLS: this file ships HTTP :80 only. Run
#   certbot --nginx -d www.stayonmap.com -d stayonmap.com
# AFTER DNS points at this box — certbot injects the `listen 443 ssl` blocks,
# the certificate paths, and the HTTP->HTTPS redirect in place. Do not add TLS
# by hand here; let certbot own it so renewals keep working.
# ============================================================================

# WebSocket upgrade helper for the Socket.io proxy below. Without the
# Upgrade/Connection headers the handshake falls back to slow polling or fails
# outright — Socket.io real-time (chat, notifications) BREAKS without this map.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect the apex to www (matches the canonical-www rule the app relies on:
# password-reset links, OG/canonical tags, and Socket.io CORS all key on www).
server {
    listen 80;
    listen [::]:80;
    server_name stayonmap.com;
    # certbot needs to answer the http-01 challenge on the apex too.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.stayonmap.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.stayonmap.com;

    # The frontend build output (deploy.sh writes it here).
    root /srv/stayonmap/frontend/dist;
    index index.html;

    # Uploaded images live on Supabase; JSON bodies are capped at 2mb by the
    # API — allow a little headroom for multipart upload proxying.
    client_max_body_size 10m;

    # ── Compression (static text assets) ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/json application/javascript
        text/javascript application/xml application/rss+xml
        image/svg+xml application/manifest+json;

    # ── API reverse proxy (keeps the /api/ prefix → backend routes /api/v1/*)
    #    No trailing slash on proxy_pass, so the URI passes through unchanged. ─
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Socket.io — MUST carry the WebSocket Upgrade/Connection headers ──────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived sockets — don't cut idle connections at 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Optional: expose the API health checks at the edge for uptime monitors.
    #
    # Two probes, and both need an EXACT-match location. `location = /health`
    # does not cover /health/ready — that fell through to the SPA catch-all
    # below and returned index.html with a 200, which is the worst possible
    # answer for a health check: an uptime monitor would call it healthy no
    # matter what the API was doing. Caught immediately after the probe
    # shipped (2026-07-30).
    #
    # /health      liveness  — shallow, no dependencies. Point restart-on-fail
    #                          automation here.
    # /health/ready readiness — checks the DB, 503 while draining. Point
    #                          uptime monitoring and deploy verification here.
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:4000/health/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Hashed build assets — immutable, cache hard ─────────────────────────
    # Vite emits content-hashed filenames under /assets, so they can be cached
    # forever; a new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Blog cover images — long cache, but NOT immutable ──────────────────
    # frontend/public/blog/ ships <slug>.jpg + _thumb/_full.webp variants
    # (backend/scripts/stamp-blog-logo.mjs). The names are slugs, not content
    # hashes, so a replaced cover keeps its URL — 30d with revalidation, never
    # `immutable`, or a redesigned cover would pin for a year.
    #
    # A REGEX on purpose, and it must stay ABOVE the `^/blog/[^/]+$` article
    # prerender block below: regex locations beat prefix ones and match in
    # file order, so a plain `location /blog/` here would LOSE every image URL
    # to the article proxy — the API would treat "<slug>_thumb.webp" as a post
    # slug, 404, and the .webp request would come back as the SPA shell.
    # `=404` rather than @spa for the same reason: a missing image should say
    # so, not answer with index.html.
    location ~ ^/blog/.+\.(?:jpg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── SEO files — generated by the API, not served from disk ─────────────
    # EXACT-match locations, so they beat `location /`'s try_files and the
    # static copies that used to sit in the build output. The old
    # frontend/public/sitemap.xml was hand-written and contained ZERO
    # /property/ URLs, which meant the one channel that scales in Indian
    # rentals could not see a single listing. The API builds both from live
    # data and caches for an hour.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:4000/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Server-rendered <head> for listing and locality pages ───────────────
    #
    # These two routes go to the API, which returns the SAME index.html with a
    # real <title>, description, canonical, OG/Twitter tags and
    # RealEstateListing JSON-LD injected. React still hydrates and renders the
    # body — this is not SSR, it is the half that link-preview crawlers can
    # actually read, because WhatsApp/Facebook/Twitter never execute JS.
    #
    # `proxy_intercept_errors on` + the @spa fallback is the load-bearing part:
    # on ANY non-200 from the API — no build on disk, listing not found, API
    # down — nginx serves the plain shell instead. The worst case is exactly
    # today's behaviour, never a broken page.
    location ~ ^/property/[^/]+$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }

    # City pages — ONE segment. Added 2026-08-08 with `/rent/:citySlug`, and it
    # is a separate block because the locality one below anchors `[^/]+/[^/]+$`
    # and therefore cannot match a single segment.
    #
    # This is the failure this file is most prone to, and it happened again:
    # deploy.sh does NOT install nginx (certbot rewrites the live file in place,
    # so overwriting it would clobber TLS). A green deploy therefore proves
    # nothing about routing — the city page shipped, the API served it, and
    # nginx quietly handed every request to the SPA fallback instead. The symptom
    # is a 200 with the DEFAULT <title>, which looks like a working page.
    # Verify with `nginx -T` (the effective loaded config), never `nginx -t`.
    location ~ ^/rent/[^/]+$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }

    location ~ ^/rent/[^/]+/[^/]+$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }

    # Articles. Same arrangement, and the surface that needs it most: a listing
    # is shared, but a guide is SEARCHED, and a search result is built entirely
    # from the <title> and description in the first response.
    #
    # `^/blog$` is exact so it cannot swallow /blog/<slug>, which the next block
    # owns. Both fall back to @spa, so an unknown slug or a restart mid-request
    # degrades to the plain shell.
    location ~ ^/blog$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }

    location ~ ^/blog/[^/]+$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }

    location @spa {
        # `internal` so this can only ever be reached via an error_page
        # redirect, never requested directly.
        internal;
        try_files /index.html =404;
    }

    # ── SPA fallback — every non-file route serves index.html ───────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
    # index.html itself must never be cached, or clients pin a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The service worker is the one file that can pin every OTHER file. A cached
    # sw.js keeps serving its old precache list, so a deploy reaches nobody until
    # the browser happens to revalidate. Ported here 2026-08-07 from the deleted
    # frontend/vercel.json, which was the only place this rule lived.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # NOTE ON SECURITY HEADERS: the API sets its own via helmet() (11 headers),
    # and those pass through the /api/ and /socket.io/ proxies untouched. We do
    # NOT re-add them here to avoid duplicate/conflicting headers on proxied
    # responses. certbot adds HSTS on the :443 block it generates. If you want
    # extra headers on the STATIC responses only, add them inside `location /`
    # (not at server scope), e.g.:
    #   add_header X-Content-Type-Options nosniff always;
    #   add_header Referrer-Policy strict-origin-when-cross-origin always;
}
